[project]
name = "ha-tidy-home-router"
version = "0.1.0"
description = "Home Assistant integration for home routers: port forwarding switches and reboot."
readme = "README.md"
license = "MIT"
authors = [{ name = "Owen Solberg" }]
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
# Tests run on 3.14, but the integration still supports HA 2025.10 on Python 3.13.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
